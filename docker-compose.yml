services:
  postgres:
    image: postgres:16-alpine
    container_name: fishdex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fishdex
      POSTGRES_PASSWORD: fishdex
      POSTGRES_DB: fishdex
    ports:
      # Porta do host mapeada para 5433: a 5432 já tem o PostgreSQL nativo do
      # Windows nesta máquina. Se a 5433 também estiver ocupada por outro
      # projeto, troque aqui e no DATABASE_URL do .env de forma consistente.
      - "5433:5432"
    volumes:
      - fishdex_pgdata:/var/lib/postgresql/data

volumes:
  fishdex_pgdata:
