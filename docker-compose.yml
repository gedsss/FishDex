services:
  postgres:
    image: postgres:16-alpine
    container_name: fishdex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fishdex
      POSTGRES_PASSWORD: fishdex
      POSTGRES_DB: fishdex
    ports:
      # Porta do host mapeada para 5434: 5432 já tem o PostgreSQL nativo do
      # Windows, e 5433 já está sendo usada por outro projeto nesta máquina.
      - "5434:5432"
    volumes:
      - fishdex_pgdata:/var/lib/postgresql/data

volumes:
  fishdex_pgdata:
