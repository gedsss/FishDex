services:
  postgres:
    image: postgres:16-alpine
    container_name: fishdex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fishdex
      POSTGRES_PASSWORD: fishdex
      POSTGRES_DB: fishdex
    ports:
      # Porta do host mapeada para 5433 (não 5432): esta máquina já tem um
      # PostgreSQL nativo do Windows ocupando 5432 (serviço "postgres.exe").
      - "5433:5432"
    volumes:
      - fishdex_pgdata:/var/lib/postgresql/data

volumes:
  fishdex_pgdata:
